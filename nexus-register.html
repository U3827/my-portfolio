<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nexus | Create Account</title>

    <link
        rel="stylesheet"
        href="nexus-register.css"
    >
</head>

<body>

    <main class="register-page">

        <div class="register-container">

            <!-- BRAND -->
            <div class="register-brand">

                <a
                    href="nexus.html"
                    class="brand-logo"
                >
                    Nexus
                </a>

                <p>
                    Learn. Build. Grow.
                </p>

            </div>


            <!-- REGISTER CARD -->
            <div class="register-card">

                <div class="register-header">

                    <h1>
                        Create your account
                    </h1>

                    <p>
                        Start your learning journey with Nexus.
                    </p>

                </div>


                <!-- FORM -->
                <form
                    id="registerForm"
                    novalidate
                >

                    <!-- FULL NAME -->
                    <div class="form-group">

                        <label
                            for="fullName"
                        >
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            placeholder="Enter your full name"
                            autocomplete="name"
                        >

                        <small
                            id="fullNameError"
                            class="form-error"
                        ></small>

                    </div>


                    <!-- EMAIL -->
                    <div class="form-group">

                        <label
                            for="email"
                        >
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                        >

                        <small
                            id="emailError"
                            class="form-error"
                        ></small>

                    </div>


                    <!-- PASSWORD -->
                    <div class="form-group">

                        <label
                            for="password"
                        >
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Create a password"
                                autocomplete="new-password"
                            >

                            <button
                                type="button"
                                id="passwordToggle"
                                class="password-toggle"
                                aria-label="Show password"
                            >
                                Show
                            </button>

                        </div>

                        <div class="password-strength">

                            <div
                                class="strength-bar"
                            >
                                <div
                                    id="strengthFill"
                                    class="strength-fill"
                                ></div>
                            </div>

                            <small
                                id="strengthText"
                            >
                                Password strength
                            </small>

                        </div>

                        <small
                            id="passwordError"
                            class="form-error"
                        ></small>

                    </div>


                    <!-- CONFIRM PASSWORD -->
                    <div class="form-group">

                        <label
                            for="confirmPassword"
                        >
                            Confirm Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Confirm your password"
                                autocomplete="new-password"
                            >

                            <button
                                type="button"
                                id="confirmPasswordToggle"
                                class="password-toggle"
                                aria-label="Show password"
                            >
                                Show
                            </button>

                        </div>

                        <small
                            id="confirmPasswordError"
                            class="form-error"
                        ></small>

                    </div>


                    <!-- TERMS -->
                    <div class="terms-group">

                        <label class="terms-label">

                            <input
                                type="checkbox"
                                id="terms"
                                name="terms"
                            >

                            <span>
                                I agree to the
                                <a href="#">
                                    Terms of Service
                                </a>
                                and
                                <a href="#">
                                    Privacy Policy
                                </a>.
                            </span>

                        </label>

                        <small
                            id="termsError"
                            class="form-error"
                        ></small>

                    </div>


                    <!-- MESSAGE -->
                    <div
                        id="formMessage"
                        class="form-message"
                        role="alert"
                        aria-live="polite"
                    ></div>


                    <!-- BUTTON -->
                    <button
                        type="submit"
                        class="create-account-btn"
                    >
                        <span>
                            Create Account
                        </span>
                    </button>

                </form>


                <!-- LOGIN -->
                <div class="login-link">

                    <p>
                        Already have an account?
                        <a href="nexus-login.html">
                            Log in
                        </a>
                    </p>

                </div>

            </div>


            <!-- BACK -->
            <div class="back-link">

                <a href="nexus.html">
                    ← Back to Nexus
                </a>

            </div>


            <!-- FOOTER -->
            <div class="register-footer">

                <p>
                    © <span id="year"></span> Nexus.
                    All rights reserved.
                </p>

            </div>

        </div>

    </main>


    <!-- =====================================================
         SUPABASE
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =====================================================
         NEXUS REGISTRATION
         INLINE VERSION
    ====================================================== -->

    <script>

    document.addEventListener("DOMContentLoaded", function () {

        console.log("Nexus registration page loaded.");


        /* =================================================
           ELEMENTS
        ================================================= */

        const form =
            document.getElementById("registerForm");

        const fullName =
            document.getElementById("fullName");

        const email =
            document.getElementById("email");

        const password =
            document.getElementById("password");

        const confirmPassword =
            document.getElementById("confirmPassword");

        const terms =
            document.getElementById("terms");

        const message =
            document.getElementById("formMessage");

        const submitButton =
            document.querySelector(
                ".create-account-btn"
            );

        const submitText =
            submitButton
                ? submitButton.querySelector("span")
                : null;

        const year =
            document.getElementById("year");


        /* =================================================
           YEAR
        ================================================= */

        if (year) {
            year.textContent =
                new Date().getFullYear();
        }


        /* =================================================
           BASIC PAGE TEST
        ================================================= */

        if (!form) {

            alert(
                "Nexus registration form could not be found."
            );

            return;
        }


        /* =================================================
           MESSAGE
        ================================================= */

        function showMessage(text) {

            if (message) {
                message.textContent = text;
                message.style.display = "block";
            }

            console.log(
                "Nexus:",
                text
            );
        }


        /* =================================================
           CHECK SUPABASE
        ================================================= */

        if (
            !window.supabase ||
            typeof window.supabase.createClient !==
            "function"
        ) {

            showMessage(
                "The Nexus authentication service could not load. Please check your internet connection and refresh the page."
            );

            return;
        }


        console.log(
            "Supabase library loaded successfully."
        );


        /* =================================================
           SUPABASE CONFIGURATION
        ================================================= */

        const SUPABASE_URL =
            "https://rjtzurluhylqvfbwajwv.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_gYy7X9szI2XlzIwasv1_XA_qg5gJnsK";


        /* =================================================
           CREATE CLIENT
        ================================================= */

        const supabase =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        console.log(
            "Supabase client created."
        );


        /* =================================================
           PASSWORD TOGGLES
        ================================================= */

        function setupToggle(
            inputId,
            buttonId
        ) {

            const input =
                document.getElementById(inputId);

            const button =
                document.getElementById(buttonId);

            if (!input || !button) {
                return;
            }

            button.addEventListener(
                "click",
                function () {

                    if (
                        input.type ===
                        "password"
                    ) {

                        input.type =
                            "text";

                        button.textContent =
                            "Hide";

                    } else {

                        input.type =
                            "password";

                        button.textContent =
                            "Show";
                    }

                }
            );
        }


        setupToggle(
            "password",
            "passwordToggle"
        );

        setupToggle(
            "confirmPassword",
            "confirmPasswordToggle"
        );


        /* =================================================
           PASSWORD STRENGTH
        ================================================= */

        const strengthFill =
            document.getElementById(
                "strengthFill"
            );

        const strengthText =
            document.getElementById(
                "strengthText"
            );


        password.addEventListener(
            "input",
            function () {

                const value =
                    password.value;

                if (!value) {

                    strengthFill.style.width =
                        "0%";

                    strengthText.textContent =
                        "Password strength";

                    return;
                }

                let score = 0;

                if (value.length >= 8) {
                    score++;
                }

                if (/[A-Z]/.test(value)) {
                    score++;
                }

                if (/[a-z]/.test(value)) {
                    score++;
                }

                if (/[0-9]/.test(value)) {
                    score++;
                }

                if (/[^A-Za-z0-9]/.test(value)) {
                    score++;
                }


                if (score <= 2) {

                    strengthFill.style.width =
                        "33%";

                    strengthText.textContent =
                        "Weak password";

                } else if (score <= 4) {

                    strengthFill.style.width =
                        "66%";

                    strengthText.textContent =
                        "Medium password";

                } else {

                    strengthFill.style.width =
                        "100%";

                    strengthText.textContent =
                        "Strong password";
                }

            }
        );


        /* =================================================
           FORM SUBMISSION
        ================================================= */

        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                console.log(
                    "Registration button clicked."
                );


                /* -----------------------------------------
                   VALUES
                ----------------------------------------- */

                const name =
                    fullName.value.trim();

                const emailValue =
                    email.value
                        .trim()
                        .toLowerCase();

                const passwordValue =
                    password.value;

                const confirmValue =
                    confirmPassword.value;


                /* -----------------------------------------
                   VALIDATION
                ----------------------------------------- */

                if (!name) {

                    showMessage(
                        "Please enter your full name."
                    );

                    fullName.focus();

                    return;
                }


                if (!emailValue) {

                    showMessage(
                        "Please enter your email address."
                    );

                    email.focus();

                    return;
                }


                if (
                    !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
                        .test(emailValue)
                ) {

                    showMessage(
                        "Please enter a valid email address."
                    );

                    email.focus();

                    return;
                }


                if (
                    passwordValue.length < 8
                ) {

                    showMessage(
                        "Password must be at least 8 characters."
                    );

                    password.focus();

                    return;
                }


                if (
                    passwordValue !==
                    confirmValue
                ) {

                    showMessage(
                        "Passwords do not match."
                    );

                    confirmPassword.focus();

                    return;
                }


                if (!terms.checked) {

                    showMessage(
                        "Please accept the Terms of Service and Privacy Policy."
                    );

                    return;
                }


                /* -----------------------------------------
                   BUTTON
                ----------------------------------------- */

                submitButton.disabled =
                    true;

                if (submitText) {

                    submitText.textContent =
                        "Creating Account...";
                }


                showMessage(
                    "Connecting to Nexus..."
                );


                try {

                    console.log(
                        "Sending registration request to Supabase..."
                    );


                    /* -------------------------------------
                       SUPABASE SIGN UP
                    ------------------------------------- */

                    const {
                        data,
                        error
                    } =
                        await supabase.auth.signUp({

                            email:
                                emailValue,

                            password:
                                passwordValue,

                            options: {

                                data: {
                                    full_name:
                                        name
                                }

                            }

                        });


                    console.log(
                        "Supabase response:",
                        data,
                        error
                    );


                    /* -------------------------------------
                       ERROR
                    ------------------------------------- */

                    if (error) {

                        showMessage(
                            "Registration error: " +
                            error.message
                        );

                        console.error(
                            "Supabase registration error:",
                            error
                        );

                        return;
                    }


                    /* -------------------------------------
