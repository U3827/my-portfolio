<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Test</title>
</head>

<body>

    <h1>Nexus Registration Test</h1>

    <p id="status">
        JavaScript has not run yet.
    </p>

    <button id="testButton">
        Test Button
    </button>

    <script>

        console.log("NEXUS TEST JAVASCRIPT IS RUNNING");

        const status =
            document.getElementById("status");

        const button =
            document.getElementById("testButton");

        status.textContent =
            "JavaScript is working.";

        button.addEventListener(
            "click",
            function () {

                status.textContent =
                    "BUTTON WORKS! JavaScript is definitely running.";

                alert(
                    "Nexus JavaScript is working!"
                );

            }
        );

    </script>

</body>
</html>
